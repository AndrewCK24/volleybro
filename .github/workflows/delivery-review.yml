name: Delivery review

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  status:

permissions:
  contents: read

concurrency:
  group: delivery-review-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  record-or-merge:
    if: >-
      vars.DELIVERY_REVIEW_ENABLED == 'true' &&
      vars.DELIVERY_REVIEWER_LOGIN != '' &&
      github.event.repository.default_branch == 'main' &&
      ((github.event_name == 'issue_comment' && github.event.action == 'created') ||
      (github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_run' && github.event.action == 'completed' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'status' && github.event.state == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
      actions: read
    steps:
      - name: Check out the trusted workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Process GitHub event
        run: node scripts/delivery-review.js event
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          DELIVERY_REVIEW_ENABLED: ${{ vars.DELIVERY_REVIEW_ENABLED }}
          DELIVERY_REVIEWER_LOGIN: ${{ vars.DELIVERY_REVIEWER_LOGIN }}

      - name: Preserve G2 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delivery-review-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delivery-review-evidence.json
          if-no-files-found: ignore
          retention-days: 90
