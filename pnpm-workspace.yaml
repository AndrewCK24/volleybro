packages:
  - "."
  - blueprint

# Only the Zod resolver is used. The resolvers package still lists ajv and ajv-formats as peers
# (optional since 5.x), which these overrides strip. Revisit before enabling the AJV resolver.
overrides:
  "@hookform/resolvers@6.0.0>ajv": "-"
  "@hookform/resolvers@6.0.0>ajv-formats": "-"
  proxy-addr@>=1.1.0 <2.0.8: ^2.0.8

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  core-js-pure: true
  esbuild: true
  mongodb-memory-server: false
  sharp: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - chromatic@18.13.1
  - "@astrojs/check@0.9.12"
  - "@astrojs/cloudflare@14.4.2"
  - "@astrojs/language-server@2.17.3"
  - "@astrojs/markdown-remark@7.3.4"
  - "@astrojs/markdown-satteri@0.4.5"
  - "@astrojs/mdx@8.1.1"
  - "@astrojs/prism@4.1.1"
  - "@astrojs/react@7.1.1"
  - "@astrojs/telemetry@3.4.1"
  - astro@7.4.2
  - lucide-react@1.61.0
  - pele@1.8.0
